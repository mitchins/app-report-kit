name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prefix worker coverage paths for Sonar
        run: |
          perl -0pi -e 's#^SF:src/#SF:worker/src/#mg' coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage/lcov.info
          if-no-files-found: ignore

  swift:
    needs: worker
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test --enable-code-coverage
      - name: Run example UI tests on iPhone 17 Pro
        working-directory: ${{ github.workspace }}/examples/ios-swiftui-example
        run: |
          xcodebuild test \
            -project AppReportKitExample.xcodeproj \
            -scheme AppReportKitExample \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/Logs/Test/AppReportKitExample.xcresult
      - name: Capture UI snapshot via simctl
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/examples/ios-swiftui-example/Screenshots
          # Find the booted iPhone 17 Pro simulator UDID
          UDID=$(xcrun simctl list devices | grep "iPhone 17 Pro" | grep "Booted" | grep -v "Max" | grep -v "17e" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$UDID" ]; then
            echo "No booted iPhone 17 Pro found; skipping simctl screenshot"
            exit 0
          fi
          echo "Capturing screenshot from $UDID"
          xcrun simctl io "$UDID" screenshot \
            "${{ github.workspace }}/examples/ios-swiftui-example/Screenshots/feedback-form-iPhone17Pro.png"
      - name: Upload UI snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appreportkit-ui-snapshot
          path: ${{ github.workspace }}/examples/ios-swiftui-example/Screenshots/feedback-form-iPhone17Pro.png
          if-no-files-found: ignore
      - name: Generate Swift coverage report
        run: |
          set -euo pipefail
          profdata=$(find .build -path '*/debug/codecov/default.profdata' -print -quit)
          xctest_bundle=$(find .build -path '*/debug/*.xctest' -type d -print -quit)
          test_binary="${xctest_bundle}/Contents/MacOS/$(basename "${xctest_bundle}" .xctest)"
          mkdir -p coverage
          xcrun llvm-cov show -instr-profile "${profdata}" "${test_binary}" > coverage/coveragereport.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: worker-coverage
          path: ${{ github.workspace }}/worker/coverage
      - name: Install SonarScanner CLI
        run: brew install sonar-scanner
      - name: Submit Swift and worker coverage analysis to SonarCloud
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          sonar-scanner \
            -Dproject.settings=sonar-project.properties \
            -Dsonar.swift.coverage.reportPaths=swift/coverage/coveragereport.txt \
            -Dsonar.javascript.lcov.reportPaths=worker/coverage/lcov.info
