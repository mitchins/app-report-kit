name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prefix worker coverage paths for Sonar
        run: |
          perl -0pi -e 's#^SF:src/#SF:worker/src/#mg' coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage/lcov.info
          if-no-files-found: ignore

  swift:
    needs: worker
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test --enable-code-coverage
      - name: Generate Swift coverage report
        run: |
          set -euo pipefail
          profdata=$(find .build -path '*/debug/codecov/default.profdata' -print -quit)
          xctest_bundle=$(find .build -path '*/debug/*.xctest' -type d -print -quit)
          test_binary="${xctest_bundle}/Contents/MacOS/$(basename "${xctest_bundle}" .xctest)"
          mkdir -p coverage
          xcrun llvm-cov show -instr-profile "${profdata}" "${test_binary}" > coverage/coveragereport.txt
      - uses: actions/download-artifact@v4
        with:
          name: worker-coverage
          path: ${{ github.workspace }}
      - name: Install SonarScanner CLI
        run: brew install sonar-scanner
      - name: Submit Swift and worker coverage analysis to SonarCloud
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          sonar-scanner \
            -Dproject.settings=sonar-project.properties \
            -Dsonar.swift.coverage.reportPaths=swift/coverage/coveragereport.txt \
            -Dsonar.javascript.lcov.reportPaths=worker/coverage/lcov.info
