name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prefix worker coverage paths for Sonar
        run: |
          perl -0pi -e 's#^SF:src/#SF:worker/src/#mg' coverage/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: worker-coverage
          path: worker/coverage/lcov.info
          if-no-files-found: ignore

  swift:
    needs: worker
    runs-on: macos-latest
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test --enable-code-coverage
      - name: Select example UI test simulator
        run: |
          set -euo pipefail
          AVAILABLE_DEVICES_JSON=$(xcrun simctl list devices available --json)
          SIMULATOR_UDID=$(printf '%s' "$AVAILABLE_DEVICES_JSON" | jq -r '
            [
              .devices[] | .[]
              | select(.isAvailable == true and (.name | test("^iPhone [0-9]+ Pro$")))
              | {
                  udid: .udid,
                  name: .name,
                  generation: (.name | capture("^iPhone (?<generation>[0-9]+) Pro$").generation | tonumber)
                }
            ]
            | sort_by(.generation)
            | last
            | .udid // ""
          ')
          SIMULATOR_NAME=$(printf '%s' "$AVAILABLE_DEVICES_JSON" | jq -r --arg udid "$SIMULATOR_UDID" '
            .devices[] | .[] | select(.udid == $udid) | .name
          ' | head -1)

          if [ -z "$SIMULATOR_UDID" ]; then
            SIMULATOR_UDID=$(printf '%s' "$AVAILABLE_DEVICES_JSON" | jq -r '
              .devices[] | .[] | select(.isAvailable == true and (.name | startswith("iPhone"))) | .udid
            ' | head -1)
            SIMULATOR_NAME=$(printf '%s' "$AVAILABLE_DEVICES_JSON" | jq -r --arg udid "$SIMULATOR_UDID" '
              .devices[] | .[] | select(.udid == $udid) | .name
            ' | head -1)
          fi

          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          echo "Using simulator: $SIMULATOR_NAME ($SIMULATOR_UDID)"
          echo "IOS_SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
      - name: Run example UI tests on selected simulator
        working-directory: ${{ github.workspace }}/examples/ios-swiftui-example
        run: |
          xcodebuild test \
            -project AppReportKitExample.xcodeproj \
            -scheme AppReportKitExample \
            -destination "id=${IOS_SIMULATOR_UDID}" \
            -derivedDataPath DerivedData \
            -resultBundlePath DerivedData/Logs/Test/AppReportKitExample.xcresult
      - name: Capture UI snapshot via simctl
        continue-on-error: true
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/examples/ios-swiftui-example/Screenshots
          PRODUCTS_DIR="${{ github.workspace }}/examples/ios-swiftui-example/DerivedData/Build/Products"
          APP_PATH=""
          if [ -d "$PRODUCTS_DIR" ]; then
            APP_PATH=$(find \
              "$PRODUCTS_DIR" \
              -path '*/Debug-iphonesimulator/AppReportKitExample.app' \
              -type d \
              -print -quit)
          fi
          UDID="${IOS_SIMULATOR_UDID:-}"
          if [ -z "$UDID" ]; then
            echo "No selected simulator available; skipping simctl screenshot"
            exit 0
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Built app bundle not found; skipping simctl screenshot"
            exit 0
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist" 2>/dev/null || true)
          if [ -z "$BUNDLE_ID" ]; then
            echo "Bundle identifier not found in $APP_PATH/Info.plist; skipping simctl screenshot"
            exit 0
          fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -appreportkit-ui-testing
          sleep 2
          echo "Capturing screenshot from ${IOS_SIMULATOR_NAME:-simulator} ($UDID)"
          xcrun simctl io "$UDID" screenshot \
            "${{ github.workspace }}/examples/ios-swiftui-example/Screenshots/feedback-form-iPhone17Pro.png"
      - name: Upload UI snapshot artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appreportkit-ui-snapshot
          path: ${{ github.workspace }}/examples/ios-swiftui-example/Screenshots/feedback-form-iPhone17Pro.png
          if-no-files-found: ignore
      - name: Generate Swift coverage report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p coverage
          if [ -d .build ]; then
            profdata=$(find .build -path '*/debug/codecov/default.profdata' -print -quit)
            xctest_bundle=$(find .build -path '*/debug/*.xctest' -type d -print -quit)
          else
            profdata=""
            xctest_bundle=""
          fi
          if [ -n "${profdata}" ] && [ -n "${xctest_bundle}" ]; then
            test_binary="${xctest_bundle}/Contents/MacOS/$(basename "${xctest_bundle}" .xctest)"
            xcrun llvm-cov show -instr-profile "${profdata}" "${test_binary}" > coverage/coveragereport.txt
          else
            echo "Swift coverage artifacts were not available."
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: always()
        continue-on-error: true
        with:
          name: worker-coverage
          path: ${{ github.workspace }}/worker/coverage
      - name: Install SonarScanner CLI
        if: always()
        run: brew install sonar-scanner
      - name: Submit Swift and worker coverage analysis to SonarCloud
        if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          args=(-Dproject.settings=sonar-project.properties)
          if [ -f swift/coverage/coveragereport.txt ]; then
            args+=(-Dsonar.swift.coverage.reportPaths=swift/coverage/coveragereport.txt)
          fi
          if [ -f worker/coverage/lcov.info ]; then
            args+=(-Dsonar.javascript.lcov.reportPaths=worker/coverage/lcov.info)
          fi
          sonar-scanner "${args[@]}"
